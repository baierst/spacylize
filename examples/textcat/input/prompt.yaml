task: textcat

# Category definitions
categories:
  - name: Electronics
    description: "tech devices, computers, phones, gadgets"
  - name: Clothing
    description: "apparel, shoes, fashion, accessories"
  - name: Home_Goods
    description: "furniture, kitchenware, decor, household items"

# Generation parameters
domain: "e-commerce product descriptions"
tone:  # one per sample, for more diverse data
  - "marketing copy"
  - "friendly and casual"
  - "concise and factual"
length:
  - "1 sentence"
  - "2-3 sentences"
  - "a short paragraph"
language: "en"

# Quality controls
constraints:
  - "Use specific product features"
  - "Include brand names where appropriate"

# Few-shot examples
examples:
  - text: "This premium wireless keyboard features mechanical switches with customizable RGB lighting and connects via Bluetooth 5.0."
    category: Electronics
